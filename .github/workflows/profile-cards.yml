name: Profile cards

on:
  push:
    branches: [main]
    paths:
      - render_cards.py
      - requirements.txt
      - assets/**
      - fonts/**
      - icons/**
      - .github/workflows/profile-cards.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render cards
        run: python render_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          if git diff --cached --quiet; then
            echo "Cards unchanged."
          else
            git commit -m "chore: re-render profile cards"
            git push
          fi
