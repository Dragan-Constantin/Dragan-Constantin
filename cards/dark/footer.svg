<svg xmlns="http://www.w3.org/2000/svg" width="880" height="104" viewBox="0 0 880 104" role="img" aria-labelledby="title">
<title id="title">aka CoffeeOverflow. Buy me a coffee on Ko-fi</title>
<style>
@font-face{font-family:'cd-body';src:url(data:font/woff;base64,) format('woff')}
.f-body{font-family:'cd-body','DM Sans', Arial, sans-serif;letter-spacing:0em}
@font-face{font-family:'cd-bold';src:url(data:font/woff;base64,) format('woff')}
.f-bold{font-family:'cd-bold','DM Sans', Arial, sans-serif;letter-spacing:0em}
@font-face{font-family:'cd-display';src:url(data:font/woff;base64,) format('woff')}
.f-display{font-family:'cd-display',Manrope, Arial, sans-serif;letter-spacing:-0.03em}

.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both}
.rise{animation-name:rise}.fade{animation-name:fade}.slide{animation-name:slide}
.grow-x,.grow-y,.pop{transform-box:fill-box}
.grow-x{animation-name:grow-x;transform-origin:0 50%}
.grow-y{animation-name:grow-y;transform-origin:50% 100%}
.pop{animation-name:pop;transform-origin:50% 50%}
.draw{animation-name:draw}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{opacity:0;transform:translateX(-12px)}}
@keyframes grow-x{from{transform:scaleX(0)}}
@keyframes grow-y{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes draw{from{stroke-dashoffset:1}}
.still{display:none}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .motion{display:none}
  .still{display:inline}
}

</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08262a"/><stop offset=".6" stop-color="#0b3036"/><stop offset="1" stop-color="#123f46"/></linearGradient><clipPath id="clip"><rect width="880" height="104" rx="16"/></clipPath></defs>
<g clip-path="url(#clip)">
<rect width="880" height="104" fill="url(#bg)"/>
<g class="a pop" style="animation-delay:3.70s"><rect x="28" y="28" width="48" height="48" rx="12" fill="#76d8d91c"/><g transform="translate(38.0 40.0) scale(1.083)" fill="none" stroke="#76d8d9" stroke-width="1.66" stroke-linecap="round" stroke-linejoin="round"><path d="M17 9h1a4 4 0 1 1 0 8h-1M3 9h14v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/></g></g>
<g class="motion"><path d="M45 40c-2-3 2-5 0-8" fill="none" stroke="#76d8d9" stroke-width="1.6" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;.9;0" dur="2.4s" begin="4.20s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 2;0 -4" dur="2.4s" begin="4.20s" repeatCount="indefinite"/></path><path d="M51 40c-2-3 2-5 0-8" fill="none" stroke="#76d8d9" stroke-width="1.6" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;.9;0" dur="2.4s" begin="4.60s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 2;0 -4" dur="2.4s" begin="4.60s" repeatCount="indefinite"/></path><path d="M57 40c-2-3 2-5 0-8" fill="none" stroke="#76d8d9" stroke-width="1.6" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;.9;0" dur="2.4s" begin="5.00s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 2;0 -4" dur="2.4s" begin="5.00s" repeatCount="indefinite"/></path></g><g class="still"><path d="M45 40c-2-3 2-5 0-8" fill="none" stroke="#76d8d9" stroke-width="1.6" stroke-linecap="round" opacity=".6"/><path d="M51 40c-2-3 2-5 0-8" fill="none" stroke="#76d8d9" stroke-width="1.6" stroke-linecap="round" opacity=".6"/><path d="M57 40c-2-3 2-5 0-8" fill="none" stroke="#76d8d9" stroke-width="1.6" stroke-linecap="round" opacity=".6"/></g>
<text x="96.0" y="47.0" font-size="18" fill="#f8fcfb" text-anchor="start" class="f-display a rise" style="animation-delay:3.80s">aka CoffeeOverflow</text>
<text x="96.0" y="70.0" font-size="13" fill="#b7d0cf" text-anchor="start" class="f-body a rise" style="animation-delay:3.88s">If something here helped or made you smile, a coffee keeps the next project brewing.</text>
<g class="a slide" style="animation-delay:4.00s"><rect x="693.9" y="33" width="158.1" height="38" rx="4" fill="#76d8d9"/><text x="711.9" y="57" font-size="13" fill="#08333a" class="f-bold">Buy me a coffee</text><g transform="translate(818.0 43.0) scale(0.708)" fill="none" stroke="#08333a" stroke-width="2.82" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></g></g>
</g>
<rect x=".5" y=".5" width="879" height="103" rx="16" fill="none" stroke="#76d8d926"/>
</svg>
