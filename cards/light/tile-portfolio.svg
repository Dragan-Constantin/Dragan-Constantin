<svg xmlns="http://www.w3.org/2000/svg" width="286" height="116" viewBox="0 0 286 116" role="img" aria-labelledby="title">
<title id="title">Portfolio: cdragan.me</title>
<style>
@font-face{font-family:'cd-body';src:url(data:font/woff;base64,) format('woff')}
.f-body{font-family:'cd-body','DM Sans', Arial, sans-serif;letter-spacing:0em}
@font-face{font-family:'cd-display';src:url(data:font/woff;base64,) format('woff')}
.f-display{font-family:'cd-display',Manrope, Arial, sans-serif;letter-spacing:-0.03em}

.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both}
.rise{animation-name:rise}.fade{animation-name:fade}.slide{animation-name:slide}
.grow-x,.grow-y,.pop{transform-box:fill-box}
.grow-x{animation-name:grow-x;transform-origin:0 50%}
.grow-y{animation-name:grow-y;transform-origin:50% 100%}
.pop{animation-name:pop;transform-origin:50% 50%}
.draw{animation-name:draw}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{opacity:0;transform:translateX(-12px)}}
@keyframes grow-x{from{transform:scaleX(0)}}
@keyframes grow-y{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes draw{from{stroke-dashoffset:1}}
.still{display:none}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .motion{display:none}
  .still{display:inline}
}

</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f7faf9"/><stop offset="1" stop-color="#e4efee"/></linearGradient><clipPath id="clip"><rect width="286" height="116" rx="14"/></clipPath></defs>
<g clip-path="url(#clip)">
<rect width="286" height="116" fill="url(#bg)"/>
<rect width="286" height="3" fill="#76d8d9" class="a grow-x" style="animation-delay:0.90s;animation-duration:0.8s"/>
<g class="a pop" style="animation-delay:0.80s;animation-duration:0.6s"><rect x="20" y="36" width="44" height="44" rx="12" fill="#eaf6f4" stroke="#17343b1f"/><g transform="translate(31.0 47.0) scale(0.917)" fill="none" stroke="#216573" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g></g>
<text x="80.0" y="55.0" font-size="18" fill="#17343b" text-anchor="start" class="f-display a rise" style="animation-delay:0.92s">Portfolio</text>
<text x="80.0" y="78.0" font-size="12.5" fill="#47727a" text-anchor="start" class="f-body a rise" style="animation-delay:1.02s">cdragan.me</text>
<g class="a slide" style="animation-delay:1.15s"><g transform="translate(246.0 39.0) scale(0.833)" fill="none" stroke="#216573" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></g></g>
</g>
<rect x=".5" y=".5" width="285" height="115" rx="14" fill="none" stroke="#17343b1f"/>
</svg>
